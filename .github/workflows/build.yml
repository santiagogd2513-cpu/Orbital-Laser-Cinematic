name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # Needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'   # ForgeGradle does not support Gradle 9 yet

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Orbital-Laser-Cinematic
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Automatic build of **Orbital Laser Cinematic**
            
            - Minecraft: 1.20.1 (Forge)
            - 3-minute orbital laser cinematic
            - Camera leaves the planet
            
            Download the `.jar` below and put it in your `mods` folder.
            
            Command in-game: `/orbitallaser start`
          files: build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}