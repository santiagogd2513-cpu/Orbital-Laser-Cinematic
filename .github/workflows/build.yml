name: Build ChunkBoost Mod

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and verify
        run: gradle clean check build --no-daemon --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChunkBoost-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
